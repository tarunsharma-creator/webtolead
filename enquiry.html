<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Enquiry</title>
    <style>
        /* CSS Reset & Box Sizing */
        *, *::before, *::after { box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f9;
            color: #333333;
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            background: #FFFFFF;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background-color: #0B1D3A;
            color: #FFFFFF;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .header p {
            margin: 0;
            color: #00AEEF;
            font-size: 16px;
            font-weight: 400;
        }

        .form-content {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #1D72F3;
            border-bottom: 2px solid #f0f4f8;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 24px;
        }

        .grid-full {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #4a5568;
        }

        .required-asterisk {
            color: #e53e3e;
            margin-left: 2px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
            color: #2d3748;
            background-color: #ffffff;
            transition: all 0.2s ease-in-out;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: #1D72F3;
            outline: none;
            box-shadow: 0 0 0 3px rgba(29, 114, 243, 0.15);
        }

        .form-group input[readonly] {
            background-color: #f7fafc;
            color: #718096;
            cursor: not-allowed;
            border-color: #e2e8f0;
        }

        .btn-submit {
            background-color: #1D72F3;
            color: #FFFFFF;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: #155bb5;
        }

        .btn-submit:disabled {
            background-color: #93bbf5;
            cursor: not-allowed;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .container {
                margin: 0 auto;
                border-radius: 0;
            }
            .grid-2 {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .form-content {
                padding: 24px 20px;
            }
            .header {
                padding: 30px 20px;
            }
        }
    </style>
</head>

                    </div>

                <button type="submit" id="submitBtn" class="btn-submit">Submit Enquiry</button>
            </div>
        </form>
    </div>

    <script>
        /* ========================================================================= */
        /* CONFIGURATION SECTION                                                     */
        /* ========================================================================= */

        // IMPORTANT: Replace this with your actual success page URL
        // e.g., "https://www.yourdomain.com/thank-you"
        const RETURN_URL = "REPLACE_WITH_YOUR_SUCCESS_PAGE_URL";

        // IMPORTANT: Replace these with actual Salesforce RecordType IDs from your Org.
        // Record Type IDs always start with "012". 
        // If not configured, the frontend will intentionally NOT submit a fake ID.
        const RECORD_TYPE_IDS = {
            "Trading": "REPLACE_WITH_TRADING_RECORDTYPE_ID",
            "Furniture": "REPLACE_WITH_FURNITURE_RECORDTYPE_ID",
            "Agro Solution": "REPLACE_WITH_AGRO_RECORDTYPE_ID"
        };

        /* ========================================================================= */
        /* BUSINESS LOGIC                                                            */
        /* ========================================================================= */

        const productToBusinessLine = {
            "Milk Powder": "Trading",
            "Chemical": "Trading",
            "Chemical Composition": "Trading",
            "Chair": "Furniture",
            "Office Chair": "Furniture",
            "Ergonomic Office Chair": "Furniture",
            "Table": "Furniture",
            "Office Table": "Furniture",
            "Desk": "Furniture",
            "Pineapple": "Agro Solution",
            "Canned Pineapple": "Agro Solution",
            "Pineapple Cans": "Agro Solution"
        };

        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. Setup Return URL safely
            const retUrlField = document.getElementById('retURL');
            if (RETURN_URL && !RETURN_URL.includes("REPLACE_WITH")) {
                retUrlField.value = RETURN_URL;
            }

            // 2. Handle Product -> Business Line -> Record Type Logic
            const productSelect = document.getElementById('00Ng800000rbNoj');
            const businessLineDisplay = document.getElementById('business_line_display');
            const recordTypeField = document.getElementById('recordType');
            
            productSelect.addEventListener('change', (e) => {
                const selectedProduct = e.target.value;
                const businessLine = productToBusinessLine[selectedProduct];
                
                if (businessLine) {
                    businessLineDisplay.value = businessLine;
                    
                    const recordTypeId = RECORD_TYPE_IDS[businessLine];
                    if (recordTypeId && !recordTypeId.includes("REPLACE_WITH")) {
                        recordTypeField.value = recordTypeId;
                        recordTypeField.disabled = false; // Enable submission of standard RecordType field
                    } else {
                        recordTypeField.disabled = true;  // Don't submit the field to prevent Salesforce errors
                    }
                } else {
                    businessLineDisplay.value = "";
                    recordTypeField.disabled = true;
                }
            });

            // 3. Date Validation (Prevent Past Dates)
            const dateInput = document.getElementById('00Ng800000rRNBj');
            const today = new Date().toISOString().split('T')[0];
            dateInput.setAttribute('min', today);

            // 4. Submission Experience
            const form = document.getElementById('salesforceEnquiryForm');
            const submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', () => {
                // The browser handles required constraints before reaching here
                // We disable the button *without* preventing the default HTML POST action
                submitBtn.disabled = true;
                submitBtn.textContent = 'Submitting...';
            });
        });
    </script>
</body>
</html>
